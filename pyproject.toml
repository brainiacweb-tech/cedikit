[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cedikit"
version = "1.2.0"
description = "A Python toolkit for Ghanaian phone numbers, cedi amounts, and Mobile Money transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francis Kusi" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "typer>=0.12"]
keywords = ["ghana", "mobile money", "momo", "cedi", "phone numbers", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
excel = ["openpyxl>=3.1"]
charts = ["matplotlib>=3.7"]
ml = ["scikit-learn>=1.3", "joblib>=1.3"]
pydantic = ["pydantic>=2.0"]
django = ["django>=4.2"]
flask = ["wtforms>=3.0"]
ocr = [
    "pillow>=10.1",
    # Windows: the OCR engine built into Windows
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    # macOS and Linux: RapidOCR (offline ONNX models)
    "rapidocr-onnxruntime>=1.2; sys_platform != 'win32'",
]
app = ["openpyxl>=3.1", "cedikit[ocr]"]
web = ["streamlit>=1.46", "openpyxl>=3.1", "cedikit[ocr]"]
all = ["cedikit[pandas,excel,charts,ml,pydantic,django,flask,web,ocr]"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "cedikit[all]",
    "pandas-stubs",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
cedikit = "cedikit.cli:app"

[project.gui-scripts]
cedikit-app = "cedikit.app.desktop:main"

[project.urls]
Homepage = "https://github.com/brainiacweb-tech/cedikit"
Issues = "https://github.com/brainiacweb-tech/cedikit/issues"
Documentation = "https://cedikit.readthedocs.io/"
Changelog = "https://github.com/brainiacweb-tech/cedikit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cedikit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cedikit --cov-report=term-missing"

[tool.coverage.run]
# The web app is exercised by tests/test_app.py through Streamlit's AppTest, which runs
# the script in a way coverage cannot trace, so it is left out of the percentage.
omit = ["*/cedikit/app/web.py"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
# Checked as 3.12 because current numpy stubs need it; 3.10 support is enforced by
# ruff (target-version) and by running the tests on 3.10 in CI.
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "wtforms.*", "django.*", "openpyxl.*", "matplotlib.*", "PIL.*", "rapidocr_onnxruntime"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM905"]
