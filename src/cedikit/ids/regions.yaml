# GhanaPostGPS region and district codes.
#
# A digital address such as AK-039-5028 starts with a two-character district
# code: the region letter (A) and a district character (K) - a letter or a digit.
#
# GhanaPostGPS predates the six regions created in 2019, so those share their
# parent region's letter (e.g. Oti addresses start with V, like Volta).
#
# Sources (accessed 2026-09-26):
#   https://www.ghanapostgps.com/ - address structure, Greater Accra sample codes
#   https://en.wikipedia.org/wiki/Postal_codes_in_Ghana - full district table
# District names follow the district map at the time the codes were assigned;
# some districts have since been split or renamed. Re-check against the official
# "Regions and District Codes" page before relying on district names.

regions:
  A: Ashanti
  B: Bono, Bono East and Ahafo
  C: Central
  E: Eastern
  G: Greater Accra
  N: Northern, Savannah and North East
  U: Upper East
  V: Volta and Oti
  W: Western and Western North
  X: Upper West

